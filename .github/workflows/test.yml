name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: The committed index.html matches the sources
        run: npm run check-build
      - name: Unit tests (Spot's brain, storage)
        run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Smoke test in SwiftShader, Low quality
        run: npm run smoke
